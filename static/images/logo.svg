<svg viewBox="0 0 200 60" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle with gradient -->
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="sphereGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#34D399;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Globe/Sphere Icon -->
  <g transform="translate(10, 10)">
    <!-- Outer circle -->
    <circle cx="20" cy="20" r="18" fill="url(#sphereGradient)" opacity="0.2"/>
    <circle cx="20" cy="20" r="18" fill="none" stroke="url(#logoGradient)" stroke-width="2.5"/>
    
    <!-- Latitude lines -->
    <ellipse cx="20" cy="20" rx="18" ry="6" fill="none" stroke="url(#logoGradient)" stroke-width="1.5" opacity="0.6"/>
    <ellipse cx="20" cy="20" rx="18" ry="12" fill="none" stroke="url(#logoGradient)" stroke-width="1.5" opacity="0.4"/>
    
    <!-- Longitude line -->
    <ellipse cx="20" cy="20" rx="6" ry="18" fill="none" stroke="url(#logoGradient)" stroke-width="1.5" opacity="0.6"/>
    
    <!-- Center dot -->
    <circle cx="20" cy="20" r="3" fill="url(#logoGradient)"/>
    
    <!-- Shopping cart element integrated -->
    <path d="M 14 18 L 16 18 L 17 24 L 23 24" fill="none" stroke="#10B981" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="18" cy="26" r="1.5" fill="#10B981"/>
    <circle cx="22" cy="26" r="1.5" fill="#10B981"/>
  </g>
  
  <!-- Text: TradeSphere -->
  <text x="55" y="28" font-family="'Segoe UI', 'Arial', sans-serif" font-size="22" font-weight="700" fill="#1F2937">
    Trade
  </text>
  <text x="55" y="28" font-family="'Segoe UI', 'Arial', sans-serif" font-size="22" font-weight="700" fill="url(#logoGradient)">
    Trade
  </text>
  
  <text x="110" y="28" font-family="'Segoe UI', 'Arial', sans-serif" font-size="22" font-weight="300" fill="#4B5563">
    Sphere
  </text>
</svg>