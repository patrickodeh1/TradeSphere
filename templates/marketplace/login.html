{% extends 'marketplace/base.html' %}

{% block title %}Login - TradeSphere{% endblock %}

{% block content %}
<div class="container">
    <div style="max-width: 500px; margin: 0 auto;">
        <div class="card">
            <div class="card-body" style="padding: 2.5rem;">
                <div class="text-center mb-4">
                    <div style="width: 80px; height: 80px; background: var(--primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem;">
                        <i class="fas fa-sign-in-alt" style="font-size: 2.5rem; color: white;"></i>
                    </div>
                    <h1 style="font-size: 2rem; margin-bottom: 0.5rem;">Welcome Back!</h1>
                    <p class="text-gray">Login to your TradeSphere account</p>
                </div>
                
                <form method="post">
                    {% csrf_token %}
                    
                    <div class="form-group">
                        <label class="form-label">
                            <i class="fas fa-user"></i> Username
                        </label>
                        <input type="text" name="username" class="form-input" 
                               placeholder="Enter your username" required autofocus>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">
                            <i class="fas fa-lock"></i> Password
                        </label>
                        <input type="password" name="password" class="form-input" 
                               placeholder="Enter your password" required>
                    </div>
                    
                    <button type="submit" class="btn btn-primary" style="width: 100%; font-size: 1.125rem; padding: 1rem;">
                        <i class="fas fa-sign-in-alt"></i> Login
                    </button>
                    
                    <p class="text-center mt-3">
                        Don't have an account? 
                        <a href="{% url 'register' %}" style="color: var(--primary); font-weight: 600;">
                            Register here
                        </a>
                    </p>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
